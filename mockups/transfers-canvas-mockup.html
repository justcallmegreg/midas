<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midas - Observe > Transfers Canvas Mockup</title>
  <style>
    /* ============================================ */
    /* FALLOUT RETRO-FUTURISTIC THEME              */
    /* ============================================ */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', 'OCR-A', monospace;
      background: linear-gradient(135deg, #0A0E27 0%, #050A15 100%);
      color: #0DF500;
      line-height: 1.4;
      overflow: hidden;
    }

    /* Scanline effect overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 1000;
    }

    .container {
      display: flex;
      height: 100vh;
      background: linear-gradient(135deg, #0A0E27 0%, #050A15 100%);
    }

    /* ============================================ */
    /* HEADER                                       */
    /* ============================================ */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(90deg, #0A0E27 0%, #1A1E3F 100%);
      border-bottom: 2px solid #0DF500;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 15px;
      z-index: 100;
      box-shadow: 0 0 10px rgba(13, 245, 0, 0.3);
    }

    .header::after {
      content: '';
      position: absolute;
      top: -2px;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #0DF500 50%, transparent);
      animation: flicker 0.2s infinite;
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }

    .logo {
      font-size: 16px;
      font-weight: bold;
      color: #FFD700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .page-title {
      font-size: 14px;
      color: #0DF500;
      text-transform: uppercase;
      letter-spacing: 1px;
      flex-grow: 1;
    }

    .close-btn {
      width: 30px;
      height: 30px;
      background: transparent;
      border: 2px solid #0DF500;
      color: #0DF500;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: #0DF500;
      color: #0A0E27;
      box-shadow: 0 0 10px rgba(13, 245, 0, 0.5);
    }

    /* ============================================ */
    /* CANVAS AREA                                  */
    /* ============================================ */

    .canvas-wrapper {
      flex-grow: 1;
      margin-top: 60px;
      background: linear-gradient(135deg, #0A0E27 0%, #050A15 100%);
      overflow: auto;
      position: relative;
    }

    .canvas {
      position: relative;
      width: 100%;
      min-height: 100%;
      padding: 40px;
      display: flex;
      gap: 80px;
      align-items: flex-start;
    }

    /* ============================================ */
    /* COLUMN STYLING                               */
    /* ============================================ */

    .column {
      display: flex;
      flex-direction: column;
      gap: 30px;
      min-width: 160px;
      position: relative;
    }

    .column.sources {
      align-items: center;
    }

    .column.timeline {
      width: 4px;
      padding: 0;
      gap: 0;
      flex-grow: 0;
    }

    .column.accounts {
      flex-direction: row;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 15px 20px;
      min-width: 500px;
    }

    .column.sinks {
      align-items: center;
    }

    /* ============================================ */
    /* TIMELINE ANIMATION                           */
    /* ============================================ */

    .timeline-bar {
      position: relative;
      width: 100%;
      height: 500px;
      background: repeating-linear-gradient(
        45deg,
        #FFD700,
        #FFD700 10px,
        transparent 10px,
        transparent 20px
      );
      animation: slideTimeline 2s linear infinite;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
      border-left: 2px solid #FFD700;
      border-right: 2px solid #FFD700;
    }

    @keyframes slideTimeline {
      0% { background-position: 0 0; }
      100% { background-position: 20px 20px; }
    }

    /* ============================================ */
    /* BOX STYLING (Sources, Accounts, Sinks)      */
    /* ============================================ */

    .box {
      position: relative;
      width: 140px;
      min-height: 80px;
      padding: 15px;
      border: 2px solid;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s;
      overflow: hidden;
    }

    /* Beveled effect with box-shadow */
    .box::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.1),
        rgba(0, 0, 0, 0.1)
      );
      pointer-events: none;
    }

    /* GREEN - SOURCES */
    .box.source {
      border-color: #0DF500;
      color: #0DF500;
      background: linear-gradient(135deg, rgba(13, 245, 0, 0.1), rgba(13, 245, 0, 0.05));
      box-shadow: 0 0 10px rgba(13, 245, 0, 0.4),
                  inset 0 0 10px rgba(13, 245, 0, 0.1);
    }

    .box.source:hover {
      box-shadow: 0 0 20px rgba(13, 245, 0, 0.8),
                  inset 0 0 15px rgba(13, 245, 0, 0.3),
                  0 0 30px rgba(13, 245, 0, 0.5);
      transform: scale(1.05);
    }

    /* YELLOW - ACCOUNTS */
    .box.account {
      border-color: #FFD700;
      color: #FFD700;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 215, 0, 0.05));
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.3),
                  inset 0 0 8px rgba(255, 215, 0, 0.1);
    }

    .box.account:hover {
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6),
                  inset 0 0 12px rgba(255, 215, 0, 0.2),
                  0 0 25px rgba(255, 215, 0, 0.4);
      transform: scale(1.05);
    }

    /* RED - SINKS */
    .box.sink {
      border-color: #FF0000;
      color: #FF0000;
      background: linear-gradient(135deg, rgba(255, 0, 0, 0.15), rgba(255, 0, 0, 0.08));
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.5),
                  inset 0 0 12px rgba(255, 0, 0, 0.15);
    }

    .box.sink:hover {
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.8),
                  inset 0 0 20px rgba(255, 0, 0, 0.3),
                  0 0 35px rgba(255, 0, 0, 0.6);
      transform: scale(1.05);
    }

    /* ============================================ */
    /* CONNECTION LINES (SVG)                       */
    /* ============================================ */

    svg.connections {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    line.transfer {
      stroke-width: 2;
      opacity: 0.6;
      transition: opacity 0.3s, stroke-width 0.3s;
    }

    line.transfer:hover {
      stroke-width: 3;
      opacity: 1;
    }

    line.transfer.income {
      stroke: #0DF500;
      filter: drop-shadow(0 0 3px rgba(13, 245, 0, 0.5));
    }

    line.transfer.expense {
      stroke: #FF0000;
      filter: drop-shadow(0 0 3px rgba(255, 0, 0, 0.5));
    }

    /* ============================================ */
    /* LEGEND                                       */
    /* ============================================ */

    .legend {
      position: absolute;
      bottom: 20px;
      left: 40px;
      background: rgba(10, 14, 39, 0.9);
      border: 2px solid #0DF500;
      padding: 15px 20px;
      border-radius: 0;
      font-size: 11px;
      display: flex;
      gap: 30px;
      box-shadow: 0 0 10px rgba(13, 245, 0, 0.3);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .legend-color {
      width: 20px;
      height: 20px;
      border: 2px solid;
      border-radius: 2px;
    }

    .legend-color.green {
      border-color: #0DF500;
      background: rgba(13, 245, 0, 0.2);
      box-shadow: 0 0 8px rgba(13, 245, 0, 0.5);
    }

    .legend-color.yellow {
      border-color: #FFD700;
      background: rgba(255, 215, 0, 0.2);
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    }

    .legend-color.red {
      border-color: #FF0000;
      background: rgba(255, 0, 0, 0.2);
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
    }

    .legend-label {
      color: #FFD700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ============================================ */
    /* RESPONSIVE                                   */
    /* ============================================ */

    @media (max-width: 1400px) {
      .canvas {
        gap: 60px;
        padding: 30px;
      }

      .box {
        width: 120px;
        min-height: 70px;
        font-size: 11px;
      }
    }

    @media (max-width: 1024px) {
      .canvas {
        gap: 40px;
        padding: 20px;
      }

      .column.accounts {
        gap: 10px 15px;
        min-width: 400px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <div class="header">
      <div class="logo">⚛ MIDAS</div>
      <div class="page-title">OBSERVE &gt; TRANSFERS [SEQUENCE DIAGRAM]</div>
      <button class="close-btn">✕</button>
    </div>

    <!-- CANVAS WRAPPER -->
    <div class="canvas-wrapper">
      <div class="canvas">
        <!-- SVG CONNECTIONS (drawn with lines) -->
        <svg class="connections" id="connections"></svg>

        <!-- SOURCES COLUMN (GREEN) -->
        <div class="column sources">
          <div class="box source" data-id="src1" data-name="Employer ABC">Employer<br/>ABC</div>
          <div class="box source" data-id="src2" data-name="Freelance">Freelance<br/>Income</div>
          <div class="box source" data-id="src3" data-name="Investments">Investment<br/>Returns</div>
        </div>

        <!-- TIMELINE (YELLOW ANIMATED STRIPES) -->
        <div class="column timeline">
          <div class="timeline-bar"></div>
        </div>

        <!-- ACCOUNTS COLUMN (YELLOW) -->
        <div class="column accounts">
          <div class="box account" data-id="acc1" data-name="Checking">Checking<br/>$5,234</div>
          <div class="box account" data-id="acc2" data-name="Savings">Savings<br/>$12,890</div>
          <div class="box account" data-id="acc3" data-name="Emergency">Emergency<br/>Fund $8,000</div>
          <div class="box account" data-id="acc4" data-name="Investment">Investment<br/>$25,670</div>
        </div>

        <!-- SINKS COLUMN (RED) -->
        <div class="column sinks">
          <div class="box sink" data-id="sink1" data-name="Rent">Rent<br/>Expense</div>
          <div class="box sink" data-id="sink2" data-name="Utilities">Utilities</div>
          <div class="box sink" data-id="sink3" data-name="Groceries">Groceries</div>
          <div class="box sink" data-id="sink4" data-name="Transport">Transport</div>
        </div>
      </div>

      <!-- LEGEND -->
      <div class="legend">
        <div class="legend-item">
          <div class="legend-color green"></div>
          <div class="legend-label">Sources</div>
        </div>
        <div class="legend-item">
          <div class="legend-color yellow"></div>
          <div class="legend-label">Accounts</div>
        </div>
        <div class="legend-item">
          <div class="legend-color red"></div>
          <div class="legend-label">Sinks</div>
        </div>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT FOR CONNECTIONS -->
  <script>
    // Sample transfer data
    const transfers = [
      // Source to Account
      { from: 'src1', to: 'acc1', amount: 3000, type: 'income' },
      { from: 'src1', to: 'acc2', amount: 2000, type: 'income' },
      { from: 'src2', to: 'acc1', amount: 500, type: 'income' },
      { from: 'src3', to: 'acc4', amount: 1500, type: 'income' },
      
      // Account to Sink
      { from: 'acc1', to: 'sink1', amount: 1200, type: 'expense' },
      { from: 'acc1', to: 'sink3', amount: 150, type: 'expense' },
      { from: 'acc2', to: 'sink2', amount: 80, type: 'expense' },
      { from: 'acc3', to: 'sink2', amount: 60, type: 'expense' },
      { from: 'acc4', to: 'sink4', amount: 200, type: 'expense' },
    ];

    function getElementCenter(id) {
      const el = document.querySelector(`[data-id="${id}"]`);
      if (!el) return null;
      const rect = el.getBoundingClientRect();
      const canvasRect = document.querySelector('.canvas').getBoundingClientRect();
      return {
        x: rect.left - canvasRect.left + rect.width / 2,
        y: rect.top - canvasRect.top + rect.height / 2,
      };
    }

    function drawConnections() {
      const svg = document.getElementById('connections');
      svg.innerHTML = '';

      transfers.forEach((transfer) => {
        const from = getElementCenter(transfer.from);
        const to = getElementCenter(transfer.to);

        if (from && to) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', from.x);
          line.setAttribute('y1', from.y);
          line.setAttribute('x2', to.x);
          line.setAttribute('y2', to.y);
          line.setAttribute('class', `transfer ${transfer.type}`);

          line.addEventListener('mouseover', () => {
            line.style.strokeWidth = '4';
            line.style.opacity = '1';
          });

          line.addEventListener('mouseout', () => {
            line.style.strokeWidth = '2';
            line.style.opacity = '0.6';
          });

          svg.appendChild(line);
        }
      });
    }

    // Draw on load and resize
    window.addEventListener('load', drawConnections);
    window.addEventListener('resize', drawConnections);

    // Add hover effect to boxes
    document.querySelectorAll('.box').forEach((box) => {
      box.addEventListener('click', () => {
        alert(`Clicked: ${box.getAttribute('data-name')}`);
      });
    });
  </script>
</body>
</html>
